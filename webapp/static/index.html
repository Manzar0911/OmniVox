<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OmniVox — Voice AI Executive Assistant</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 680px;
    margin: 40px auto;
    padding: 0 16px;
    background: #0b0e14;
    color: #e6e6e6;
  }
  h1 { font-size: 1.5rem; margin-bottom: 6px; }
  p.sub { color: #94a3b8; margin-top: 0; font-size: 0.95rem; }
  .badge {
    display: inline-block;
    background: #1e293b;
    color: #38bdf8;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  #log {
    border: 1px solid #262c36;
    border-radius: 10px;
    padding: 16px;
    min-height: 240px;
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 16px;
    background: #12161f;
  }
  .msg { margin-bottom: 12px; line-height: 1.5; }
  .you { color: #7dd3fc; }
  .agent { color: #86efac; }
  button {
    font-size: 1rem;
    padding: 12px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin-right: 8px;
    font-weight: 500;
    transition: all 0.2s ease;
    user-select: none;
  }
  #recordBtn { background: #ef4444; color: white; }
  #recordBtn.recording { background: #991b1b; transform: scale(0.98); }
  #textForm { display: flex; gap: 8px; margin-top: 18px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #262c36;
    background: #12161f;
    color: #eee;
    font-size: 1rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: #38bdf8; }
  #submitBtn { background: #2563eb; color: white; }
  #status { color: #94a3b8; font-size: 0.9rem; margin-top: 10px; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="badge">AWS BEDROCK • NOVA 2 LITE</div>
  <h1>🎙️ OmniVox — Voice AI Executive Assistant</h1>
  <p class="sub">Hold the button to speak, or type your executive command below.</p>

  <div id="log"></div>

  <button id="recordBtn">🎤 Hold to talk</button>
  <div id="status"></div>

  <form id="textForm">
    <input type="text" id="textInput" placeholder="e.g. Check my latest unread email, or research AI trends..." autocomplete="off" />
    <button type="submit" id="submitBtn">Send</button>
  </form>

<script>
const sessionId = localStorage.getItem("session_id") || crypto.randomUUID();
localStorage.setItem("session_id", sessionId);

const log = document.getElementById("log");
const statusEl = document.getElementById("status");
const recordBtn = document.getElementById("recordBtn");

function addMessage(who, text) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = (who === "you" ? "You: " : "OmniVox: ") + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function speakReply(text) {
  if (window.speechSynthesis && text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.05;
    window.speechSynthesis.speak(utterance);
  }
}

async function sendQuery(text) {
  if (!text) return;
  addMessage("you", text);
  statusEl.textContent = "OmniVox is thinking...";

  const form = new FormData();
  form.append("message", text);
  form.append("session_id", sessionId);

  try {
    const res = await fetch("/api/chat", { method: "POST", body: form });
    const data = await res.json();
    addMessage("agent", data.reply);
    speakReply(data.reply);
  } catch (err) {
    addMessage("agent", "Error: " + err);
  } finally {
    statusEl.textContent = "";
  }
}

document.getElementById("textForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendQuery(text);
});

// Web Speech Recognition for in-browser speech recognition
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recognizedText = "";
let isListening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-US";

  recognition.onstart = () => {
    isListening = true;
    recognizedText = "";
    recordBtn.classList.add("recording");
    statusEl.textContent = "Listening to your voice...";
  };

  recognition.onresult = (event) => {
    if (event.results && event.results[0]) {
      recognizedText = event.results[0][0].transcript;
      statusEl.textContent = `Heard: "${recognizedText}"`;
    }
  };

  recognition.onerror = (event) => {
    console.warn("Speech recognition error:", event.error);
    statusEl.textContent = "Voice error: " + event.error;
  };

  recognition.onend = () => {
    isListening = false;
    recordBtn.classList.remove("recording");
    if (recognizedText.trim()) {
      sendQuery(recognizedText.trim());
    } else {
      statusEl.textContent = "";
    }
  };
}

function startListening() {
  if (recognition) {
    try {
      recognition.start();
    } catch (e) {
      console.warn("Recognition already active", e);
    }
  } else {
    statusEl.textContent = "Speech recognition is not supported in this browser. Please type below.";
  }
}

function stopListening() {
  if (recognition && isListening) {
    recognition.stop();
  }
}

recordBtn.addEventListener("mousedown", startListening);
recordBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startListening(); });
recordBtn.addEventListener("mouseup", stopListening);
recordBtn.addEventListener("mouseleave", stopListening);
recordBtn.addEventListener("touchend", stopListening);
</script>
</body>
</html>
